resources:
  repositories:
    - repository: Pipeline-Templates
      type: git
      name: Pipeline-Templates
      ref: 'main'

variables:
- name: buildproject
  value: '**/*.sln'

- name: BuildConfiguration
  value: 'Release'

stages:
  - stage: 
    jobs:
      - template: BuildPipelines/dotnetbuild.yml@Pipeline-Templates